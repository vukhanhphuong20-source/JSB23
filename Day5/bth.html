<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container {
            width: 500px;
            height: 460px;
            border: 1px rgb(211, 209, 209) solid;
            border-radius: 20px;
            padding: 10px;
            margin: 10px;
            justify-content: center;


        }
        input {
            width: 400px;
            height: 50px;


        }

        button {

            width: 400px;
            height: 40px;
            background-color: rgb(86, 143, 86);
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
    <div>
    <h1 style="text-align: center;"> Contact Us</h1>
    <label for="inputText">Name</label>
    <br>
    <input id="inputText" type="text" placeholder="Enter name" />
    <br />
    </div>

    <div>
    <label for="inputText1">Email</label>
    <br>
    <input id="inputText1" type="email" placeholder="Enter email" />
    <br />
    </div>

    <div>
    <label for="inputText2">Phone</label>
    <br>
    <input id="inputText2" type="number" placeholder="Enter phone number" />
    <br />
    </div>

    <div>
    <label for="inputText3">Message</label>
    <br>
    <textarea style="height: 50px; width: 400px;" name="" id="inputText3"></textarea>
    <br />
    </div>

    <div>

        <button> Send Message </button>
    </div>

    </div>


</body>

</html>
