<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web1</title>
</head>

<body>
    <!-- Thẻ h : heading ( h1->h6 )-->
    <h1> Phuong </h1>
    <h2> Phuong </h2>
    <h3> Phuong </h3>



    <!-- Thẻ p : paragraph -->
    <p> ấksjakjskajsajkjskajskjkkj</p>

    <!-- Thẻ image: thẻ chứa hình ảnh
      - Thuộc tính src: source => Nguồn ảnh
      - alt: dùng để hiển thị nội dung khi mà ảnh bị lỗi
     -->
    <!-- Comment code: ctrl + phím ? -->
    <img width="200px"
        src="https://fptcloud.com/wp-content/uploads/2024/11/he-thong-ha-tang-may-chu-vat-ly-fptcloud-768x511.webp"
        alt="anh sieu ngau">
    <!-- Thẻ a: đường dẫn link
      - href : hyperlink reference => đường dẫn link
     -->
    <a href="https://vinuni.edu.vn/vi/trang-chu/">Dan sang duong link Vin University</a>
    <!-- thẻ u : underline -->
    <p> Thời tiết <u> Hà Nội</u> rất xấu</p>

    <!-- thẻ b : bold -->
    <p> Thời tiết <b> Hà Nội</b> rất xấu</p>

    <!-- thẻ i : italic -->
    <p> Thời tiết <i> Hà Nội</i> rất xấu</p>

    <!-- ul: unorder list  -->
    <ul>
        <li> arigatou </li>
        <li> kawaii </li>
        <li> =33 </li>
    </ul>

    <ol>
        <li> arigatou </li>
        <li> kawaii </li>
        <li> =33 </li>
    </ol>


</body>

</html>
