<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .menu {
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 50px;
            padding-right: 50px;
            background-color: grey;
        }

        .logo {
            font-size: 25px;
            padding: 20px;
            font-weight: bold;
        }

        .logo:hover {
            background-color: antiquewhite;
            cursor: pointer;
        }

        .menu-items {
            display: flex;
        }

        .items {
            padding: 25px;
            font-size: 25px;
            font-weight: bold;
        }

        .items:hover {
            background-color: brown;
            cursor: pointer;
        }

        .sp {

            align-items: center;
            font-weight: bold;
        }

        .layout {
            border: 2px solid;
            height: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 50px;
            padding-right: 50px;
            background-color: grey;
        }

        .layout-box {
            height: 300px;
            width: 300px;
            padding-left: 20px;
            padding-right: 20px;
            border: 1px solid;
            border-radius: 20px;
            background-color: rgb(173, 226, 209);
            align-items: center;

        }

        .box {
            padding: 25px;
            font-size: 25px;


        }

        .img {
            height: 200px;
            width: 200px;
            padding: 30px;
        }



        .btn-add {
        width: 100%;
        padding: 12px 0;
        background-color: #7c4242;
        color: #ffffff;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        

    }
        .btn-add:hover {
            background-color: #633434;


        }
</style>

        
    </style>
</head>

<body>
    <div class="menu">
        <div class="logo">Logo</div>

        <div class="menu-items">
            <div class="items">Trang chủ</div>
            <div class="items">Sản phẩm</div>
            <div class="items">Liên hệ</div>
            <div class="items">Giỏ hàng</div>
        </div>
    </div>

    <div class="sp"> SẢN PHẨM NỔI BẬT </div>

    <div class="layout">

        <div class="layout-box">
            <img class="img" src="https://i.pinimg.com/736x/0c/09/e7/0c09e722a6903a2ea13280bae1d8fcc5.jpg" alt="hình ảnh">
                
            <div> <button class="btn-add"> Mua hàng </button> </div>
        </div>

        <div class="layout-box">
            <img class="img" src="https://i.pinimg.com/736x/0c/09/e7/0c09e722a6903a2ea13280bae1d8fcc5.jpg" alt="hình ảnh">

            <div> <button class="btn-add"> Mua hàng </button> </div>
        </div>

        <div class="layout-box">
            <img class="img" src="https://i.pinimg.com/736x/0c/09/e7/0c09e722a6903a2ea13280bae1d8fcc5.jpg" alt="hình ảnh">

            <div> <button class="btn-add"> Mua hàng </button> </div>
        </div>
        


    </div>
</body>

</html>
