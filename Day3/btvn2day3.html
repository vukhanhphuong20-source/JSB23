<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>

        .navbar {
            background-color: #3a73a5;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .navbar .logo {
            display: inline;
            vertical-align: middle;
        }

        .navbar .logo img {
            width: 40px;
            height: 40px;
            vertical-align: middle;
            margin-right: 15px;
        }

        .navbar ul {
            display: inline;
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .navbar ul li {
            display: inline;
            margin-right: 20px;
        }


        .navbar ul li a:hover {
            color: #272626;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1HE51g1QFrOdlhF0eLqVjsYNknuh_bIdCYqjAj1sg3g&s=10" alt="Logo">
        </div>

        <ul>
            <li><a href="https://docs.google.com/document/u/0/?tgif=d">Trang chủ</a></li>
            <li><a href="https://docs.google.com/document/u/0/?tgif=d">Giới thiệu</a></li>
            <li><a href="https://docs.google.com/document/u/0/?tgif=d">Dịch vụ</a></li>
            <li><a href="https://docs.google.com/document/u/0/?tgif=d">Liên hệ</a></li>
        </ul>
    </div>

</body>

</html>
