<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .footer {
            background-color: #182a4a;
            padding: 50px 20px;
            color: #ffffff;
        }

        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }

        .footer-col {
            flex: 1;
            width: 160px;
        }

        .footer-col h4 {
            font-size: 12px;
            font-weight: 700;
            color: #8c9bb0;
            letter-spacing: 0.5px;
            margin-bottom: 18px;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .footer-col ul li:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <footer class="footer">
        <div class="footer-container">

            <div class="footer-col">
                <h4>AWESOMEVERSE</h4>
                <ul>
                    <li>Web Awesome</li>
                    <li>11ty</li>
                    <li>Podcast Awesome</li>
                    <li>Blog Awesome</li>
                </ul>
            </div>

            <div class="footer-col">
                <h4>FONT AWESOME</h4>
                <ul>
                    <li>Download</li>
                    <li>Changelog</li>
                    <li>All Versions</li>
                    <li>Icon Requests</li>
                </ul>
            </div>

            <div class="footer-col">
                <h4>COMMUNITY</h4>
                <ul>
                    <li>GitHub</li>
                    <li>YouTube</li>
                    <li>Threads</li>
                    <li>Awesome Swag</li>
                </ul>
            </div>

            <div class="footer-col">
                <h4>HELP</h4>
                <ul>
                    <li>Support</li>
                    <li>Troubleshooting</li>
                    <li>Contact Us</li>
                    <li>Status</li>
                </ul>
            </div>

        </div>
    </footer>

</body>
</html>
